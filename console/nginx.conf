# Text assets are compressed once when the image is built (name.br and name.gz sit next to
# each file), so nothing is compressed per request. A browser that accepts Brotli gets the
# .br copy, which is about a fifth smaller than gzip.
map $http_accept_encoding $console_br {
    default                        "";
    "~*(^|[ ,])br([ ,;]|$)"        ".br";
}

server {
    listen       4200;
    server_name  10.42.13.107;
    root         /usr/share/nginx/html;

    # For anything that has no prebuilt copy (the mounted images, index.html).
    # The host nginx may proxy here over HTTP/1.0, which nginx does not compress by default.
    gzip on;
    gzip_http_version 1.0;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json application/xml image/svg+xml font/ttf;

    location / {
        try_files $uri $uri/ /index.html =404;
    }

    # A missing script or stylesheet is a 404 here, not the start page: after an upgrade an
    # old page asking for an old file must fail cleanly so it can reload itself.
    location ~* \.(js|css|svg|json|map)$ {
        gzip_static on;
        add_header Vary Accept-Encoding;
        set $console_pick $console_br;
        if (!-f $request_filename.br) {
            set $console_pick "";
        }
        if ($console_pick) {
            rewrite ^(.*)$ $1.br last;
        }
    }

    location ~* \.js\.br$ {
        internal;
        gzip off;
        types { }
        default_type application/javascript;
        add_header Content-Encoding br;
        add_header Vary Accept-Encoding;
    }

    location ~* \.css\.br$ {
        internal;
        gzip off;
        types { }
        default_type text/css;
        add_header Content-Encoding br;
        add_header Vary Accept-Encoding;
    }

    location ~* \.svg\.br$ {
        internal;
        gzip off;
        types { }
        default_type image/svg+xml;
        add_header Content-Encoding br;
        add_header Vary Accept-Encoding;
    }

    location ~* \.(json|map)\.br$ {
        internal;
        gzip off;
        types { }
        default_type application/json;
        add_header Content-Encoding br;
        add_header Vary Accept-Encoding;
    }

    # Serve runtime config with no cache
    location = /fleetbase.config.json {
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
        try_files /fleetbase.config.json @config_fallback;
    }

    location @config_fallback {
        return 200 '{}';
    }
}
