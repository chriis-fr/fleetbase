<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="msapplication-TileColor" content="#da532c" />
    <meta name="theme-color" content="#ffffff" />
    <title>Chains | FleetOPS</title>

    {{content-for "head"}}

    <!-- The loading screen's logo, asked for ahead of the scripts so it shows at once. -->
    <link rel="preload" as="image" href="{{rootURL}}favicon/android-chrome-192x192.png" fetchpriority="high" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon/android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon/android-chrome-256x256.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <link rel="mask-icon" href="/favicon/safari-pinned-tab.svg" color="#5bbad5" />
    <link integrity="" rel="stylesheet" href="{{rootURL}}assets/vendor.css">
    <link integrity="" rel="stylesheet" href="{{rootURL}}assets/@fleetbase/console.css">

    <style>
      /* Painted with the page itself, before any stylesheet arrives. */
      html.boot-dark,
      html.boot-dark body {
        background-color: #111827;
      }
      #boot-loader {
        position: absolute;
        z-index: 9999999999;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #boot-loader .boot-mark {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      #boot-loader .boot-mark img {
        width: 72px;
        height: 72px;
        border-radius: 16px;
      }
      #boot-loader .boot-bar {
        width: 72px;
        height: 3px;
        margin-top: 14px;
        border-radius: 3px;
        background: rgba(148, 163, 184, 0.25);
        overflow: hidden;
      }
      #boot-loader .boot-bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 3px;
        background: #3b82f6;
        animation: boot-slide 0.9s ease-in-out infinite alternate;
      }
      @keyframes boot-slide {
        from {
          transform: translateX(-20%);
        }
        to {
          transform: translateX(170%);
        }
      }
    </style>
    <script>
      // Dark from the first paint unless this browser saved the light theme; the app sets the real theme when it starts.
      (function () {
        var light = false;
        try {
          for (var i = 0; i < localStorage.length; i++) {
            var key = localStorage.key(i);
            if (/theme/i.test(key) && /light/i.test(localStorage.getItem(key) || '')) {
              light = true;
            }
          }
        } catch (e) {}
        if (!light) {
          document.documentElement.className += ' boot-dark';
        }
      })();
    </script>

    {{content-for "head-footer"}}
  </head>
  <body>
    {{content-for "body"}}
    <div id="boot-loader">
      <div class="boot-mark">
        <img src="{{rootURL}}favicon/android-chrome-192x192.png" width="72" height="72" alt="Chains FleetOps" fetchpriority="high" />
        <div class="boot-bar"></div>
      </div>
    </div>
    <script>
      // public/sw.js keeps the start page on this device, so a repeat visit does not wait on the network.
      // After an upgrade it reports the new build; a page that has only just opened reloads into it once.
      (function () {
        if (!('serviceWorker' in navigator)) {
          return;
        }
        navigator.serviceWorker.addEventListener('message', function (event) {
          var data = event.data || {};
          if (data.type !== 'console-updated') {
            return;
          }
          var justOpened = performance.now() < 15000 || document.getElementById('boot-loader');
          try {
            if (justOpened && sessionStorage.getItem('console-reloaded-for') !== data.build) {
              sessionStorage.setItem('console-reloaded-for', data.build);
              location.reload();
            }
          } catch (e) {}
        });
        navigator.serviceWorker.startMessages();
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('{{rootURL}}sw.js').catch(function () {});
        });
      })();
    </script>
    <script src="{{rootURL}}assets/vendor.js"></script>
    <script src="{{rootURL}}assets/@fleetbase/console.js"></script>

    {{content-for "body-footer"}}
  </body>
</html>
